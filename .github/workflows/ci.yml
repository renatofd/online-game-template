name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint & format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate maps
        run: pnpm maps:validate
      - name: Unit & integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
