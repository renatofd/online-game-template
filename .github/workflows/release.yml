# Builds a release when a tag like v1.2.3 is pushed (or manually from the Actions tab):
#  - server: Docker image pushed to GitHub Container Registry (ghcr.io/<owner>/<repo>-server)
#  - client: zip ready for GamePush / itch.io, attached to the GitHub release
#  - optional: pushes the client to itch.io when BUTLER_API_KEY and ITCH_TARGET are configured
#
# Configure in GitHub → Settings → Secrets and variables → Actions (see docs/DEPLOY.md):
#   Variables: VITE_SERVER_URL, VITE_PLATFORM, VITE_GAMEPUSH_PROJECT_ID, VITE_GAMEPUSH_PUBLIC_TOKEN, ITCH_TARGET
#   Secrets:   BUTLER_API_KEY
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_ID=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  client:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be used in `if:` directly; exposing it as job env makes the itch.io step optional.
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check client settings
        id: settings
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::warning::VITE_SERVER_URL is not set: this client cannot find the game server. It will not be pushed to itch.io."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build client
        run: pnpm build:client
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_PLATFORM: ${{ vars.VITE_PLATFORM }}
          VITE_GAMEPUSH_PROJECT_ID: ${{ vars.VITE_GAMEPUSH_PROJECT_ID }}
          VITE_GAMEPUSH_PUBLIC_TOKEN: ${{ vars.VITE_GAMEPUSH_PUBLIC_TOKEN }}
          VITE_BUILD_ID: ${{ github.ref_name }}
      - run: pnpm pack:client
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: release/*.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && vars.ITCH_TARGET != '' && steps.settings.outputs.ready == 'true'
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push apps/client/dist "${{ vars.ITCH_TARGET }}:html5" --userversion "${{ github.ref_name }}"
