# Local production-like stack: game server + Redis.
#   docker compose -f infra/docker-compose.yml up --build
# The server answers on http://localhost:2567, so `pnpm dev:client` can use it.
# Running several servers needs one PUBLIC_ADDRESS per server (see docs/DEPLOY.md, "Escala horizontal").
services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      # ALLOWED_ORIGINS: http://localhost:3000
      # MONITOR_PASSWORD: change-me
      # GAMEPUSH_PROJECT_ID: ""
      # GAMEPUSH_API_SECRET: ""
    ports:
      - "2567:2567"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
